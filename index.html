<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashora</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!--  Sidebar  -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <h1>Dashora <span>Organizer</span></h1>
  </div>
  <div class="sidebar-search">
    <input type="text" class="search-box" placeholder="Search... (Ctrl+K)" id="searchBox" oninput="onSearch()">
  </div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-bottom">
    <button class="btn btn-primary btn-block" onclick="openSectionModal()">+ New Section</button>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-ghost btn-block btn-sm" onclick="exportData()">Export</button>
      <button class="btn btn-ghost btn-block btn-sm" onclick="document.getElementById('importInput').click()">Import</button>
    </div>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</aside>

<!--  Main Area  -->
<div class="main" id="main">
  <div class="main-header" id="mainHeader">
    <div class="main-header-left">
      <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
    </div>
  </div>
  <div class="main-body" id="mainBody">
    <div class="empty-state">
      <h3>Select a section</h3>
      <p>Pick a section from the sidebar or create a new one</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!--  Section Modal  -->
<div class="modal-overlay" id="sectionModal">
  <div class="modal">
    <h2 id="sectionModalTitle">New Section</h2>
    <input type="hidden" id="editSectionId">
    <div class="form-group">
      <label>Section Name</label>
      <input type="text" id="sectionName" placeholder="e.g. Regressions, Tasks for Today..."
             onkeydown="if(event.key==='Enter')saveSection()">
    </div>
    <div class="form-group">
      <label>Color</label>
      <div class="color-options" id="colorOptions"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('sectionModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSection()">Save</button>
    </div>
  </div>
</div>

<!--  Item Modal  -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <h2 id="itemModalTitle">New Item</h2>
    <input type="hidden" id="editItemId">
    <input type="hidden" id="itemSectionId">
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="itemTitle" placeholder="What needs attention?"
             onkeydown="if(event.key==='Enter')saveItem()">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="itemDesc" placeholder="Details, notes, context..."></textarea>
    </div>
    <div class="form-group">
      <label>Link (optional)</label>
      <input type="text" id="itemLink" placeholder="https://...">
    </div>
    <div class="form-group form-group-inline">
      <label class="toggle-label">
        <input type="checkbox" id="itemRecurring">
        <span class="toggle-slider"></span>
        <span>Recurring daily task</span>
      </label>
      <div class="form-hint">When marked done, this task resets to active each morning</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('itemModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<!--  Scripts  -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>

</body>
</html>
